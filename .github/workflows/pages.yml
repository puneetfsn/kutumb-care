name: Deploy web app to GitHub Pages

# The Pages site now EXISTS with build_type "workflow" (Settings → Pages →
# GitHub Actions), so the official Actions deployment works. The original
# failure ("Resource not accessible by integration" in configure-pages with
# enablement: true) happened because no token is allowed to CREATE a site —
# that one-time creation has since been done by a human, so enablement is
# deliberately NOT requested here anymore.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish web/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
