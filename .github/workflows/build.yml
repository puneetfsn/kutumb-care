name: Build APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest image already ships the Android command-line tools,
      # platform 34 and build-tools 34.0.0. Using them avoids the third-party
      # setup action and its download step.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found at $SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK"
          ls "$SDK/platforms"
          ls "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      # Compiler diagnostics are echoed as workflow annotations so a red run is
      # readable straight from the run summary.
      - name: Build debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $status"
            grep -E '^(e:|error:|> Task .* FAILED|FAILURE:)' /tmp/build.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      # Hard privacy gate: the shipped manifest must never request network access.
      - name: Verify no network permission
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "Inspecting $APK"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT="$SDK/build-tools/34.0.0/aapt2"
          "$AAPT" dump permissions "$APK"
          if "$AAPT" dump permissions "$APK" | grep -qiE 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)'; then
            echo "::error::Privacy violation: the built APK requests network permissions."
            exit 1
          fi
          echo "Privacy check passed: no INTERNET permission in the APK."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kutumb-care-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
